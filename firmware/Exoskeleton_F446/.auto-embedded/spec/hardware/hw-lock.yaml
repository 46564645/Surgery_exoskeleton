# 2026-09-25 S1 design/configuration lock, NOT physical verification.
# Truth: Exoskeleton_F446.ioc + hardware_interface_registry.md section 4.1.4.
# Reserved CAN/HX711 pins have no firmware driver. No DMA/IRQ invented for them.
pins:
  - {id: PA2, func: USART2_TX_AF7, owner: board_console, status: configured_not_validated}
  - {id: PA3, func: USART2_RX_AF7, owner: board_console, status: configured_not_validated}
  - {id: PA5, func: LED2, owner: board_runtime, status: configured_not_validated}
  - {id: PC13, func: USER_BUTTON_EXTI13, owner: board_runtime, status: configured_not_validated}
  - {id: PA13, func: SWDIO, owner: debug, status: reserved}
  - {id: PA14, func: SWCLK, owner: debug, status: reserved}
  - {id: PB3, func: SWO, owner: debug, status: reserved}
  - {id: PB9, func: CAN1_TX_AF9, owner: shoulder_can, status: design_reserved}
  - {id: PB8, func: CAN1_RX_AF9, owner: shoulder_can, status: design_reserved}
  - {id: PB13, func: CAN2_TX_AF9, owner: elbow_can, status: design_reserved}
  - {id: PB12, func: CAN2_RX_AF9, owner: elbow_can, status: design_reserved}
  - {id: PC3, func: HX711_SCK_LEVEL_SHIFT, owner: hx711, status: design_reserved}
  - {id: PC2, func: HX711_DOUT_LEVEL_SHIFT, owner: hx711, status: design_reserved}
dma:
  - {stream: DMA1_Stream5, channel: 4, peripheral: USART2_RX, owner: board_console}
  - {stream: DMA1_Stream6, channel: 4, peripheral: USART2_TX, owner: board_console}
irq:
  - {irqn: USART2_IRQn, priority_preempt: 5, priority_sub: 0, owner: board_console}
  - {irqn: DMA1_Stream5_IRQn, priority_preempt: 5, priority_sub: 0, owner: board_console}
  - {irqn: DMA1_Stream6_IRQn, priority_preempt: 5, priority_sub: 0, owner: board_console}
  # BSP writes 15; board_runtime overwrites to 10 and checks AFTER BSP_PB_Init.
  - {irqn: EXTI15_10_IRQn, priority_preempt: 10, priority_sub: 0, owner: board_runtime}
  - {irqn: SysTick_IRQn, priority_preempt: 0, priority_sub: 0, owner: HAL_timebase}
timers:
  - {id: SysTick, func: HAL_1ms_tick, owner: HAL_timebase}
